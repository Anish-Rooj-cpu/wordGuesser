<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Guessing Game</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container" id="lobby-screen">
        <div class="lobby-card">
            <h1>Word Guessing Game</h1>
            <p>Welcome! Choose to create a new game or join an existing one.</p>
            
            <div class="lobby-sections">
                <div class="lobby-section">
                    <h2>Create New Game</h2>
                    <label>Team:
                        <select id="create-team">
                            <option value="red">Red Team</option>
                            <option value="blue">Blue Team</option>
                        </select>
                    </label>
                    <label>Role:
                        <select id="create-role">
                            <option value="spymaster">Spymaster</option>
                            <option value="guesser">Guesser</option>
                        </select>
                    </label>
                    <button id="create-btn" class="primary-btn">Generate Game</button>
                </div>
                
                <div class="divider"></div>
                
                <div class="lobby-section">
                    <h2>Join Game</h2>
                    <label>Game Code:
                        <input type="text" id="join-id" placeholder="e.g. ABCDEF">
                    </label>
                    <label>Team:
                        <select id="join-team">
                            <option value="red">Red Team</option>
                            <option value="blue">Blue Team</option>
                        </select>
                    </label>
                    <label>Role:
                        <select id="join-role">
                            <option value="guesser">Guesser</option>
                            <option value="spymaster">Spymaster</option>
                        </select>
                    </label>
                    <button id="join-btn" class="primary-btn">Join Game</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container hidden" id="game-screen">
        <header>
            <div class="header-left">
                <h1>Word Guesser</h1>
                <span class="game-code-badge">Code: <strong id="display-game-id"></strong></span>
                <span class="player-info-badge" id="player-info-badge"></span>
            </div>
        </header>

        <div class="game-info">
            <div class="score">
                <span class="red-score">Red: <span id="red-left">12</span></span>
                <span class="turn-indicator" id="turn-indicator">Red's Turn</span>
                <span class="blue-score">Blue: <span id="blue-left">12</span></span>
            </div>
            
            <div class="controls">
                <button id="end-turn-btn">End Turn</button>
            </div>
        </div>

        <div class="main-content">
            <div class="board-container">
                <div id="board" class="board"></div>
            </div>

            <div class="sidebar">
                <div class="hint-section">
                    <h3>Chat / Hints</h3>
                    <div id="hint-log" class="hint-log"></div>
                    <div class="hint-input-container" id="hint-controls">
                        <input type="text" id="hint-word" placeholder="Hint word">
                        <input type="number" id="hint-number" placeholder="#" min="0" max="12" style="width: 50px;">
                        <button id="submit-hint">Send</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="winner-text"></h2>
                <button id="new-game-btn">Return to Lobby</button>
            </div>
        </div>
    </div>
    
    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
