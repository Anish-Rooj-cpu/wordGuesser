<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codenames — Word Guesser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
    <style>.hidden { display: none !important; }</style>
</head>
<body>

    <!-- ════════════════ LOBBY ════════════════ -->
    <div id="lobby-screen">
        <div class="lobby-wrapper">
            <div class="lobby-brand">
                <div class="lobby-logo">🕵️</div>
                <h1>Codenames</h1>
                <p>Create a game and share the code, or join an existing room.</p>
            </div>

            <div class="lobby-panels">
                <!-- CREATE -->
                <div class="lobby-panel">
                    <div class="panel-header">
                        <span class="panel-icon">✨</span>
                        <h2>New Game</h2>
                    </div>
                    <div class="field">
                        <label for="create-team">Team</label>
                        <select id="create-team">
                            <option value="red">🔴  Red Team</option>
                            <option value="blue">🔵  Blue Team</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="create-role">Role</label>
                        <select id="create-role">
                            <option value="spymaster">🕵️  Spymaster</option>
                            <option value="guesser">🎯  Guesser</option>
                        </select>
                    </div>
                    <button id="create-btn" class="btn btn-primary">Create Game</button>
                </div>

                <div class="lobby-divider">
                    <span>OR</span>
                </div>

                <!-- JOIN -->
                <div class="lobby-panel">
                    <div class="panel-header">
                        <span class="panel-icon">🔗</span>
                        <h2>Join Game</h2>
                    </div>
                    <div class="field">
                        <label for="join-id">Game Code</label>
                        <input type="text" id="join-id" placeholder="e.g. X7K2MQ" maxlength="6" spellcheck="false" autocomplete="off">
                    </div>
                    <div class="field">
                        <label for="join-team">Team</label>
                        <select id="join-team">
                            <option value="red">🔴  Red Team</option>
                            <option value="blue">🔵  Blue Team</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="join-role">Role</label>
                        <select id="join-role">
                            <option value="guesser">🎯  Guesser</option>
                            <option value="spymaster">🕵️  Spymaster</option>
                        </select>
                    </div>
                    <button id="join-btn" class="btn btn-secondary">Join Game</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ════════════════ GAME ════════════════ -->
    <div id="game-screen" class="hidden">
        <!-- Top bar -->
        <header class="topbar">
            <div class="topbar-left">
                <span class="topbar-brand">🕵️ Codenames</span>
                <span class="badge badge-code" id="display-game-id"></span>
                <span class="badge badge-role" id="player-info-badge"></span>
            </div>
            <div class="topbar-right">
                <div class="scoreboard">
                    <span class="score-red">🔴 <span id="red-left">12</span></span>
                    <span class="turn-pill" id="turn-indicator">Red's Turn</span>
                    <span class="score-blue">🔵 <span id="blue-left">12</span></span>
                </div>
                <button id="end-turn-btn" class="btn btn-end-turn">End Turn</button>
            </div>
        </header>

        <!-- Board + Sidebar -->
        <div class="game-body">
            <div class="board-area">
                <div id="board" class="board"></div>
            </div>

            <aside class="chat-panel">
                <h3 class="chat-title">💬 Chat &amp; Hints</h3>
                <div id="hint-log" class="chat-log"></div>
                <div class="chat-input-row" id="hint-controls">
                    <input type="text" id="hint-word" placeholder="Hint word…" spellcheck="false" autocomplete="off">
                    <input type="number" id="hint-number" placeholder="#" min="0" max="12">
                    <button id="submit-hint" class="btn btn-send">Send</button>
                </div>
            </aside>
        </div>

        <!-- Game-over modal -->
        <div id="game-over-modal" class="overlay hidden">
            <div class="modal-card">
                <h2 id="winner-text"></h2>
                <button id="new-game-btn" class="btn btn-primary">Return to Lobby</button>
            </div>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Game Logic -->
    <script src="script.js?v=4"></script>
</body>
</html>
